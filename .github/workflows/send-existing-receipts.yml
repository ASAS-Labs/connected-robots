name: Send receipts to existing registrations

on:
  workflow_dispatch:
    inputs:
      notice:
        description: Optional lead paragraph (for example, a date change)
        required: false
        default: ""
        type: string
      subject:
        description: Optional subject (defaults to the registration confirmation subject)
        required: false
        default: ""
        type: string
      dry_run:
        description: Count registrations without sending
        required: false
        default: false
        type: boolean

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Send receipts
        env:
          CONFIRMATION_FROM_EMAIL: ${{ secrets.WORKSHOP_CONFIRMATION_FROM_EMAIL }}
          RECEIPT_NOTICE: ${{ inputs.notice }}
          RECEIPT_SUBJECT: ${{ inputs.subject }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash .github/scripts/send-existing-receipts.sh
