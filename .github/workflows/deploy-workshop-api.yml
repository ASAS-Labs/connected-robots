name: Deploy workshop registration API (SAM)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'aws/workshop-register/**'

jobs:
  deploy-workshop-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify SAM project path
        run: |
          test -d aws/workshop-register || { echo "Missing aws/workshop-register — commit the SAM app from this repo." >&2; exit 1; }
          test -f aws/workshop-register/template.yaml || { echo "Missing aws/workshop-register/template.yaml" >&2; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Ensure SES sender identity
        run: bash aws/workshop-register/scripts/ensure-ses-identity.sh

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM build
        working-directory: aws/workshop-register
        run: sam build

      - name: SAM deploy
        working-directory: aws/workshop-register
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.WORKSHOP_TURNSTILE_SECRET_KEY }}
          CONFIRMATION_FROM_EMAIL: ${{ secrets.WORKSHOP_CONFIRMATION_FROM_EMAIL }}
          ORGANIZER_NOTIFY_EMAIL: ${{ secrets.WORKSHOP_ORGANIZER_NOTIFY_EMAIL }}
        run: |
          set -e
          OVERRIDES=(
            'PublicSiteOrigin=https://ears-conn.com'
            'ThankYouPath=/register.html?thanks=1'
          )
          if [ -n "${TURNSTILE_SECRET_KEY:-}" ]; then
            OVERRIDES+=("TurnstileSecretKey=${TURNSTILE_SECRET_KEY}")
          fi
          if [ -n "${CONFIRMATION_FROM_EMAIL:-}" ]; then
            OVERRIDES+=("ConfirmationFromEmail=${CONFIRMATION_FROM_EMAIL}")
          fi
          if [ -n "${ORGANIZER_NOTIFY_EMAIL:-}" ]; then
            OVERRIDES+=("OrganizerNotifyEmail=${ORGANIZER_NOTIFY_EMAIL}")
          fi
          sam deploy \
            --no-confirm-changeset \
            --capabilities CAPABILITY_IAM \
            --stack-name ears-conn-workshop-register \
            --resolve-s3 \
            --parameter-overrides "${OVERRIDES[@]}" \
            --no-fail-on-empty-changeset
